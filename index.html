<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NavegaKids · Segurança na Internet</title>
    <meta
      name="description"
      content="Jogo educativo NavegaKids: 3 ilhas, 15 fases e 45 atividades sobre segurança na internet para crianças."
    >
    <link rel="icon" type="image/png" href="img/pirata.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
    >

    <script>
      /* Lista única dos arquivos do jogo.
         VERSAO: troque só aqui depois de publicar uma mudança, para o navegador baixar tudo de novo.
         A ORDEM importa: cada arquivo usa o que os anteriores registraram em window.NavegaKids. */
      window.NavegaKids = {
        arquivos: {
          VERSAO: '20261021b',
          css: ['base', 'telas', 'atividades', 'acessibilidade'],
          js: [
            // conteúdo e configuração (imagens, roteiro)
            'config',
            'data',
            // pontos, estrelas, selos e desbloqueio
            'pontuacao',
            'progresso',
            // textos do Marujo e dicas por nível
            'textos-curtos',
            'dicas',
            // imagens, popups e montagem das telas
            'core',
            // voz, dicas e incentivo
            'apoio',
            // tela de atividade e os tipos de atividade
            'activities',
            'activities2',
            // música de fundo (Web Audio, sem arquivo)
            'musica',
            // peças e popups usados por várias telas
            'telas/comum',
            'telas/jogador',
            // uma tela por arquivo
            'telas/inicio',
            'telas/ilhas',
            'telas/mapa',
            'telas/capitao',
            'telas/abertura',
            'telas/missoes',
            'telas/conclusao',
            'telas/diario',
            'telas/certificado',
            // liga cada endereço à sua tela
            'router',
            // painel de acessibilidade
            'acessibilidade'
          ]
        }
      };

      NavegaKids.arquivos.css.forEach(nome =>
        document.write(`<link rel="stylesheet" href="css/${nome}.css?v=${NavegaKids.arquivos.VERSAO}">`)
      );
    </script>
  </head>

  <body>
    <header class="topbar" id="topbar"></header>
    <main id="stage" role="main"></main>

    <script>
      NavegaKids.arquivos.js.forEach(nome =>
        document.write(`<script src="js/${nome}.js?v=${NavegaKids.arquivos.VERSAO}"><\/script>`)
      );
    </script>
  </body>
</html>
