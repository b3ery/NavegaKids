<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NavegaKids · Segurança na Internet</title>
<meta name="description" content="Jogo educativo NavegaKids: 3 ilhas, 15 fases e 45 atividades sobre segurança na internet para crianças.">
<link rel="icon" type="image/png" href="img/pirata.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* Lista única dos arquivos do jogo.
     VERSAO: troque só aqui depois de publicar uma mudança, para o navegador baixar tudo de novo.
     A ORDEM importa: cada arquivo usa o que os anteriores registraram em window.NavegaKids. */
  window.NavegaKids = { arquivos: {
    VERSAO: '20261020a',
    css: ['base', 'telas', 'atividades', 'acessibilidade'],
    js: [
      'config', 'data',                              // conteúdo e configuração (imagens, roteiro)
      'pontuacao', 'progresso',                      // pontos, estrelas, selos e desbloqueio
      'textos-curtos', 'dicas',                      // textos do Marujo e dicas por nível
      'core',                                        // imagens, popups e montagem das telas
      'apoio',                                       // voz, dicas e incentivo
      'activities', 'activities2',                   // tela de atividade e os tipos de atividade
      'musica',                                      // música de fundo (Web Audio, sem arquivo)
      'telas/comum', 'telas/jogador',                // peças e popups usados por várias telas
      'telas/inicio', 'telas/ilhas', 'telas/mapa', 'telas/capitao', 'telas/abertura',
      'telas/missoes', 'telas/conclusao', 'telas/diario', 'telas/certificado',
      'router',                                      // liga cada endereço à sua tela
      'acessibilidade'                               // painel de acessibilidade
    ]
  } };
  NavegaKids.arquivos.css.forEach(n => document.write(`<link rel="stylesheet" href="css/${n}.css?v=${NavegaKids.arquivos.VERSAO}">`));
</script>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="stage" role="main"></main>
  <script>
    NavegaKids.arquivos.js.forEach(n => document.write(`<script src="js/${n}.js?v=${NavegaKids.arquivos.VERSAO}"><\/script>`));
  </script>
</body>
</html>
